name: Publish container

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "SemVer image tag, for example v1.0.4"
        required: true
        type: string

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: dlackovic2/redi-api

jobs:
  publish:
    name: Build, verify, and publish
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select and validate version
        id: version
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version="${DISPATCH_VERSION:-${GITHUB_REF_NAME}}"
          if [[ ! "${version}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version must match vMAJOR.MINOR.PATCH; got '${version}'" >&2
            exit 1
          fi
          echo "value=${version}" >> "${GITHUB_OUTPUT}"

      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "${GHCR_TOKEN}" |
            docker login "${REGISTRY}" --username "${GITHUB_ACTOR}" --password-stdin

      - name: Build image
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          docker build --pull \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.version=${VERSION}" \
            --tag "${REGISTRY}/${IMAGE_NAME}:${VERSION}" \
            --tag "${REGISTRY}/${IMAGE_NAME}:latest" \
            .

      - name: Smoke-test image
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          container_id="$(
            docker run --detach --publish 127.0.0.1:8000:8000 \
              "${REGISTRY}/${IMAGE_NAME}:${VERSION}"
          )"
          trap 'docker logs "${container_id}"; docker rm --force "${container_id}"' EXIT

          for attempt in {1..45}; do
            if curl --fail --silent --show-error http://127.0.0.1:8000/health; then
              exit 0
            fi
            sleep 2
          done

          echo "Container did not become healthy within 90 seconds" >&2
          exit 1

      - name: Push version and latest tags
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          docker push "${REGISTRY}/${IMAGE_NAME}:${VERSION}"
          docker push "${REGISTRY}/${IMAGE_NAME}:latest"
